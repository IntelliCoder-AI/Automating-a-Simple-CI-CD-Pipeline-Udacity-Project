name: Deploy Knowledge Base

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Configured environment variables at the Job Level snippet (Rubric Requirement)
    env:
      URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT || '5' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Use actions/cache@v4 to store the node_modules folder (Rubric Requirement)
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Using npm install because we are directly caching node_modules
      - name: Install Dependencies
        run: npm install

      - name: Run Linters
        run: npm run lint:all

      - name: Run URL Checker
        run: node script/url-checker.js -t $URL_CHECKER_TIMEOUT -d src/posts

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      # Define step-level dynamic environment variable (Rubric Requirement)
      - name: Build Static Site
        run: |
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2-)
          export PATH_PREFIX="/$REPO_NAME/"
          npm run prod

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Report Deployment Status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deployment.outputs.page_url }}
          STATUS: ${{ job.status }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          
          # Fallback if deployment URL is missing
          if [ -z "$URL" ]; then
            REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2-)
            URL="https://${{ github.repository_owner }}.github.io/$REPO_NAME/"
          fi
          
          gh issue create \
            --title "$DATE - Deployment: $STATUS" \
            --body "URL: $URL" \
            --repo ${{ github.repository }}
